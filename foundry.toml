[profile.default]
solc = "0.8.24"
src = "contracts"
out = "out"
libs = ["node_modules"]
test = "foundry/tests"
script = "foundry/scripts"

[lint]
exclude_lints = [
  "mixed-case-variable",
  "pascal-case-struct",
  "mixed-case-function",
  "screaming-snake-case-const",
  "screaming-snake-case-immutable",
  "unsafe-cheatcode",
  "unsafe-typecast",
]
